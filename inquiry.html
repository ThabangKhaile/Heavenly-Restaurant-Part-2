<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - Heavenly Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><img src="images/Heavenly Restaurant Logo.png" alt="Heavenly Restaurant" class="logo-img"></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html">Menu</a></li>
                <li><a href="inquiry.html" class="active">Inquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="inquiry">
        <div class="container">
            <h1>Make an Inquiry</h1>
            <p>Have questions about our services or special requests? Fill out the form below.</p>
            
            <form class="inquiry-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit Inquiry</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Heavenly Restaurant. All rights reserved.</p>
    </footer>
</body>
</html>
